name: build-examples-other

# Tatoeba-only example corpora for Chinese, Korean, Spanish and French.
# (Japanese has its own daily workflow because of the Gemini step.)
on:
  schedule:
    - cron: "0 4 2 * *"   # monthly -- Tatoeba itself is re-exported weekly, this is plenty
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: zh, tag: examples-zh, db: ccedict_examples }
          - { lang: ko, tag: examples-ko, db: kor_examples }
          - { lang: es, tag: examples-es, db: spa_examples }
          - { lang: fr, tag: examples-fr, db: fra_examples }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jieba (Chinese word index)
        if: matrix.lang == 'zh'
        run: pip install jieba

      - name: Tests
        run: python tests/test_builders.py

      - name: Previous examples manifest
        run: |
          mkdir -p out
          curl -fsSL -o out/prev-manifest.json \
            "https://github.com/${{ github.repository }}/releases/download/${{ matrix.tag }}/manifest.json" || true

      - name: Build ${{ matrix.db }}.db
        id: build
        run: |
          python scripts/build_examples.py --lang ${{ matrix.lang }} \
            --out-dir out \
            --prev-manifest out/prev-manifest.json \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ matrix.tag }}"

      - name: Publish release assets
        if: steps.build.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.lang }} examples (rolling)
          make_latest: false
          files: |
            out/${{ matrix.db }}.db.gz
            out/manifest.json
