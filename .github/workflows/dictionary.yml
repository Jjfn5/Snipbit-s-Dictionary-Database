name: build-dictionary

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if upstream is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false          # one broken upstream must not block the others
      matrix:
        include:
          - source: jmdict
            cmd: python scripts/build_jmdict.py
          - source: ccedict
            cmd: python scripts/build_ccedict.py
          - source: kor
            cmd: python scripts/build_krdict.py
          - source: spa
            cmd: python scripts/build_kaikki.py --lang spa
          - source: fra
            cmd: python scripts/build_kaikki.py --lang fra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python tests/test_translit.py
          python tests/test_builders.py

      - name: Fetch previous manifest (for change detection)
        if: ${{ !inputs.force }}
        run: |
          mkdir -p out
          curl -fsSL -o out/prev-manifest.json \
            "https://github.com/${{ github.repository }}/releases/download/${{ matrix.source }}/manifest.json" || true

      - name: Build ${{ matrix.source }}.db
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ${{ matrix.cmd }} \
            --out-dir out \
            --prev-manifest out/prev-manifest.json \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ matrix.source }}"

      # One rolling release tag per source: the app always reads the same
      # stable URL, and re-publishing just replaces the assets.
      - name: Publish release assets
        if: steps.build.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.source }}
          name: ${{ matrix.source }} dictionary (rolling)
          make_latest: false
          files: |
            out/${{ matrix.source }}.db.gz
            out/manifest.json
