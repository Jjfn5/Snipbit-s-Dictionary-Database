name: build-dictionary

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if upstream is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One release per language, shared with that language's examples build.
    concurrency:
      group: release-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false          # one broken upstream must not block the others
      matrix:
        include:
          - source: jmdict
            name: Japanese
            cmd: python dictionaries/ja/jmdict.py
          - source: ccedict
            name: Chinese
            cmd: python dictionaries/zh/ccedict.py
          - source: kor
            name: Korean
            cmd: python dictionaries/ko/krdict.py
          - source: spa
            name: Spanish
            cmd: python dictionaries/es/kaikki.py
          - source: fra
            name: French
            cmd: python dictionaries/fr/kaikki.py
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Frequency ranks (freq_rank column) come from wordfreq's per-language lists.
      - name: Install wordfreq (frequency lists)
        run: pip install wordfreq

      - name: Tests
        run: |
          python tests/test_translit.py
          python tests/test_builders.py
          python tests/test_examples.py

      - name: Fetch previous manifest (for change detection)
        if: ${{ !inputs.force }}
        run: |
          mkdir -p out
          curl -fsSL -o out/prev-manifest.json \
            "https://github.com/${{ github.repository }}/releases/download/${{ matrix.source }}/manifest.json" || true

      - name: Build ${{ matrix.source }}.db
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ${{ matrix.cmd }} \
            --out-dir out \
            --prev-manifest out/prev-manifest.json \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ matrix.source }}"

      # One rolling release per language (tag = source id). Assets are named
      # per kind, so this replaces only the dictionary files and leaves the
      # examples files published by the examples workflow untouched.
      - name: Publish release assets
        if: steps.build.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.source }}
          name: ${{ matrix.name }} (rolling)
          make_latest: false
          files: |
            out/${{ matrix.source }}.db.gz
            out/manifest.json
